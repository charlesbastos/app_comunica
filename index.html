<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicativo de Comunicação Alternativa</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="imagens/gabriel.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1 - Container Superior (Acao) -->
    <div id="container-superior" class="container-imagens"></div>

    <!-- 3 - Área Central -->
    <div class="area-central">
        <div class="cards-grid">
            <!-- Card 1: Gabriel (Fixo) -->
            <div class="card-wrapper">
                <div class="card moldura-branca" id="card-1">
                    <img src="imagens/gabriel.jpg" alt="Gabriel">
                </div>
                <div class="card-nome">gabriel</div>
                <button class="btn-limpar-card" disabled style="opacity: 0; pointer-events: none;">Limpar</button>
            </div>

            <!-- Card 2: Ação -->
            <div class="card-wrapper">
                <div class="card moldura-vermelha" id="card-2" data-origem="acao"></div>
                <div class="card-nome" id="nome-card-2"></div>
                <button class="btn-limpar-card" id="btn-limpar-card-2" disabled>Limpar</button>
            </div>

            <!-- Card 3: Objeto 1 -->
            <div class="card-wrapper">
                <div class="card moldura-azul" id="card-3" data-origem="objetos"></div>
                <div class="card-nome" id="nome-card-3"></div>
                <button class="btn-limpar-card" id="btn-limpar-card-3" disabled>Limpar</button>
            </div>

            <!-- Card 4: Objeto 2 -->
            <div class="card-wrapper">
                <div class="card moldura-amarelo" id="card-4" data-origem="objetos"></div>
                <div class="card-nome" id="nome-card-4"></div>
                <button class="btn-limpar-card" id="btn-limpar-card-4" disabled>Limpar</button>
            </div>

            <!-- Card 5: Objeto 3 -->
            <div class="card-wrapper">
                <div class="card moldura-verde" id="card-5" data-origem="objetos"></div>
                <div class="card-nome" id="nome-card-5"></div>
                <button class="btn-limpar-card" id="btn-limpar-card-5" disabled>Limpar</button>
            </div>
        </div>

        <div class="controles-frase">
            <!-- 4 - Caixa de Texto para a frase -->
            <input type="text" id="caixa-frase" class="caixa-texto" placeholder="Monte a frase com os cards..." disabled>
            
            <!-- 4 & 6 - Container União Inferior -->
            <div class="container-controles-botoes">
                <div class="botoes-grupo">
                    <button id="btn-audio" class="btn-audio" disabled>Ouvir Frase</button>
                    <button id="btn-limpar" class="btn-limpar">Limpar Tudo</button>
                </div>
                
                <div class="selecoes-grupo">
                    <label class="checkbox-label">
                        <input type="checkbox" id="chk-auto" disabled>
                        <span>Falar frase automaticamente</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- 2 - Container Inferior (Objetos) -->
    <div id="container-inferior" class="container-imagens"></div>

    <!-- xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
         Inclusão do Script para o aplicativo PWA no celular -->
    <!-- Tradutor de eventos Touch para Drag nativo (Celular) -->
    <script src="drag-drop-touch.js"></script>

    <!-- Inclusão do Script Separado -->
    <script src="app.js"></script>

     <!-- Inclusão do Script para o aplicativo PWA no celular -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker registrado!', reg))
            .catch(err => console.log('Falha no Service Worker:', err));
        });
      }
    </script>
</body>
</html>
